[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisweep"
description = "Find and prevent AI-agent attribution artifacts in git commits — session URLs, \"Generated with Claude Code\" lines, AI co-author trailers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "w1977-0" }]
keywords = ["git", "claude", "claude-code", "cursor", "copilot", "aider", "ai", "commit", "hygiene", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/w1977-0/aisweep"
Source = "https://github.com/w1977-0/aisweep"
Issues = "https://github.com/w1977-0/aisweep/issues"
Changelog = "https://github.com/w1977-0/aisweep/blob/main/CHANGELOG.md"

[project.scripts]
aisweep = "aisweep.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["aisweep"]

[tool.setuptools.dynamic]
version = { attr = "aisweep.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
